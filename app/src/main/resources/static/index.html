<!-- Head Section (Metadata and Resources) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set Character Encoding -->
    <meta charset="UTF-8">
    <!-- Set the Page Title -->
    <title>Select Role</title>
    
    <!-- Favicon -->
    <link rel="icon" href="../assets/images/logo/Logo.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- JavaScript -->
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>
<body>
    <!-- Main Layout Container -->
    <div class="container">
        <!-- Wrapper -->
        <div class="wrapper">
            
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <!-- Main Section -->
            <main class="main-content">
                <h2>Select Your Role</h2>
                
                <div class="role-buttons">
                    <button id="adminLogin" class="dashboard-btn">Admin</button>
                    <button id="doctorLogin" class="dashboard-btn">Doctor</button>
                    <button id="patient-role-btn" class="dashboard-btn" onclick="selectRole('patient')">Patient</button>
                </div>
            </main>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
            
        </div>
    </div>

    <!-- Hidden Modal Overlay -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <!-- Dynamic Form Area -->
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page-Specific Service Logic -->
    <script type="module" src="../js/services/index.js" defer></script>
</body>
</html>
